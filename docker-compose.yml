services:
  app:
    build:
      context: .
      target: development
    container_name: dtp-app
    restart: unless-stopped
    command: >
      sh -c "bun install --frozen-lockfile &&
             bun run start:dev"
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${DATABASE_USER:-dtp_user}:${DATABASE_PASSWORD:-dtp_password}@postgres:5432/${DATABASE_NAME:-distributed_transaction_processing}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: ${DOCKER_AWS_ENDPOINT_URL:-http://ministack:4566}
      SQS_ENDPOINT: ${DOCKER_SQS_ENDPOINT:-http://ministack:4566}
      SQS_CONSUMER_ENABLED: ${SQS_CONSUMER_ENABLED:-true}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-30}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_PUBLISHER_INTERVAL_MS: ${OUTBOX_PUBLISHER_INTERVAL_MS:-1000}
      OUTBOX_QUEUE_NAME: ${OUTBOX_QUEUE_NAME:-wager-events.fifo}
      PENDING_REFERENCE_WORKER_ENABLED: ${PENDING_REFERENCE_WORKER_ENABLED:-true}
      PENDING_REFERENCE_WORKER_INTERVAL_MS: ${PENDING_REFERENCE_WORKER_INTERVAL_MS:-5000}
      PENDING_REFERENCE_MAX_ATTEMPTS: ${PENDING_REFERENCE_MAX_ATTEMPTS:-8}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: dtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-distributed_transaction_processing}
      POSTGRES_USER: ${DATABASE_USER:-dtp_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dtp_password}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_USER:-dtp_user} -d ${DATABASE_NAME:-distributed_transaction_processing}
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:latest
    container_name: dtp-ministack
    restart: unless-stopped
    ports:
      - '${MINISTACK_PORT:-4566}:4566'
    environment:
      GATEWAY_PORT: 4566
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      LOG_LEVEL: ${MINISTACK_LOG_LEVEL:-INFO}
      PERSIST_STATE: '1'
      STATE_DIR: /data/ministack-state
    volumes:
      - ministack_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_node_modules:
  postgres_data:
  ministack_data:
